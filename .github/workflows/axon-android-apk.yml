name: Build AXON icon-fix APK

on:
  push:
    branches:
      - build/axon-android-iconfix
    paths:
      - "android-wrapper/**"
      - ".github/workflows/axon-android-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Compile, verify, and launch AXON APK
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"

      - name: Install Android platform and build tools
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Prepare PNG from selected AXON WebP icon
        shell: bash
        working-directory: android-wrapper
        run: |
          set -euo pipefail
          python -m pip install --quiet Pillow
          python - <<'PY'
          import base64
          import io
          from pathlib import Path
          from PIL import Image
          assets = Path("app/src/main/assets")
          raw = base64.b64decode((assets / "axon_icon_base64.txt").read_text().strip(), validate=True)
          icon = Image.open(io.BytesIO(raw)).convert("RGBA")
          output = assets / "axon_icon_source.png"
          icon.save(output, format="PNG", optimize=True)
          check = Image.open(output)
          assert check.width > 0 and check.height > 0
          print(f"AXON launcher icon prepared: {check.width}x{check.height}")
          PY

      - name: Verify requested AXON dashboard is reachable
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl --location --silent --show-error --output /tmp/axon-dashboard.html --write-out '%{http_code}' --max-time 30 https://axon-ai-trading.vercel.app/)"
          echo "Dashboard HTTP status: $code"
          test "$code" = "200"
          grep -Eiq '<!doctype html|<html' /tmp/axon-dashboard.html

      - name: Build debug APK
        working-directory: android-wrapper
        run: gradle --no-daemon clean assembleDebug

      - name: Verify APK, launcher activity, and signature
        shell: bash
        run: |
          set -euo pipefail
          APK="android-wrapper/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          DEXDUMP="$(find "$ANDROID_HOME/build-tools" -type f -name dexdump | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          test -x "$AAPT"
          test -x "$DEXDUMP"
          "$APKSIGNER" verify --verbose "$APK"
          ACTIVITY_CLASS="$(find android-wrapper/app/build/intermediates -type f -path '*/com/axon/aitrading/iconfix/MainActivity.class' -print -quit)"
          test -n "$ACTIVITY_CLASS"
          test -s "$ACTIVITY_CLASS"
          DEX_MATCH=false
          while IFS= read -r dexfile; do
            unzip -p "$APK" "$dexfile" > /tmp/axon-classes.dex
            if "$DEXDUMP" -d /tmp/axon-classes.dex 2>/dev/null | grep -Fq "Lcom/axon/aitrading/iconfix/MainActivity;"; then
              echo "Launcher activity found in $dexfile"
              DEX_MATCH=true
              break
            fi
          done < <(unzip -Z1 "$APK" | grep -E '^classes([0-9]+)?[.]dex$')
          test "$DEX_MATCH" = true
          BADGING="$("$AAPT" dump badging "$APK")"
          echo "$BADGING" | grep -F "package: name='com.axon.aitrading.iconfix.debug'"
          sha256sum "$APK"
          cp "$APK" AXON-AI-TRADING-iconfix.apk

      - name: Upload APK build artifact
        uses: actions/upload-artifact@v4
        with:
          name: AXON-AI-TRADING-iconfix-APK
          path: AXON-AI-TRADING-iconfix.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish downloadable test release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: axon-iconfix-${{ github.run_number }}
          name: AXON AI TRADING — Latest Android APK (build ${{ github.run_number }})
          prerelease: true
          files: AXON-AI-TRADING-iconfix.apk
          fail_on_unmatched_files: true

      - name: Install and launch APK in Android emulator
        timeout-minutes: 16
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-boot-timeout: 480
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot -no-snapshot-save
          disable-animations: true
          script: |
            set -eu
            APK="android-wrapper/app/build/outputs/apk/debug/app-debug.apk"
            timeout 90s adb install -r "$APK"
            adb shell pm list packages | grep -F "package:com.axon.aitrading.iconfix.debug"
            adb logcat -c
            timeout 30s adb shell monkey -p com.axon.aitrading.iconfix.debug 1
            sleep 5
            adb shell dumpsys activity activities | grep -E "mResumedActivity|topResumedActivity" | grep -F "com.axon.aitrading.iconfix.debug"
            if adb logcat -d -s AndroidRuntime:E | grep -q "FATAL EXCEPTION"; then
              echo "Fatal exception detected after app launch."
              exit 1
            fi

      - name: Remove obsolete AXON APK test releases
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const currentTag = `axon-iconfix-${context.runNumber}`;
            const releases = await github.paginate(github.rest.repos.listReleases, {
              owner, repo, per_page: 100
            });
            for (const release of releases) {
              if (!release.prerelease ||
                  !release.tag_name.startsWith("axon-iconfix-") ||
                  release.tag_name === currentTag) continue;
              core.info(`Removing obsolete APK release: ${release.tag_name}`);
              await github.rest.repos.deleteRelease({
                owner, repo, release_id: release.id
              });
              try {
                await github.rest.git.deleteRef({
                  owner, repo, ref: `tags/${release.tag_name}`
                });
              } catch (error) {
                core.warning(`Could not remove tag ${release.tag_name}: ${error.message}`);
              }
            }
