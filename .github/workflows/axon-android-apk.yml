name: Build AXON icon-fix APK

on:
  push:
    branches:
      - build/axon-android-iconfix
    paths:
      - "android-wrapper/**"
      - ".github/workflows/axon-android-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Compile and verify installable APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform and build tools
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        working-directory: android-wrapper
        run: gradle --no-daemon clean assembleDebug

      - name: Verify APK, app id and signature
        shell: bash
        run: |
          set -euo pipefail
          APK="android-wrapper/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          test -x "$AAPT"
          "$APKSIGNER" verify --verbose "$APK"
          BADGING="$("$AAPT" dump badging "$APK")"
          echo "$BADGING" | sed -n '1p'
          echo "$BADGING" | grep -F "package: name='com.axon.aitrading.iconfix.debug'"
          sha256sum "$APK"
          cp "$APK" AXON-AI-TRADING-iconfix.apk

      - name: Upload APK build artifact
        uses: actions/upload-artifact@v4
        with:
          name: AXON-AI-TRADING-iconfix-APK
          path: AXON-AI-TRADING-iconfix.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish downloadable test release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: axon-iconfix-${{ github.run_number }}
          name: AXON AI TRADING — Icon Fix Test ${{ github.run_number }}
          prerelease: true
          files: AXON-AI-TRADING-iconfix.apk
          fail_on_unmatched_files: true
