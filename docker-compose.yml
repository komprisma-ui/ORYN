services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: oryn
      POSTGRES_PASSWORD: oryn
      POSTGRES_DB: oryn
    ports: ["5432:5432"]
    volumes: ["oryn_pg:/var/lib/postgresql/data"]
  redis:
    image: redis:8-alpine
    ports: ["6379:6379"]
volumes:
  oryn_pg:
